[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "liquiditylab"
version = "0.1.0"
description = "Causal spot execution replay and Gymnasium environment"
requires-python = ">=3.12"
dependencies = ["gymnasium>=1.0,<2", "numpy>=2,<3", "websockets>=14,<17"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
rl = ["stable-baselines3>=2.5,<3", "torch>=2.3,<3"]

[project.scripts]
liquiditylab = "liquiditylab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/liquiditylab"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "rl", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
